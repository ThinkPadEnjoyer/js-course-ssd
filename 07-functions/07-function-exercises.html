<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Functions Exercises</title>

<body>
  <script>
    function greeting(name) { // 7a - 7c
      if (!!name) { // double NOT operator flips the boolean value twice and checks to see if its true or false
        console.log(`Hello ${name}!`);
      } else {
        console.log('Hi there!');
      }
    }

    greeting('Kaleb');
    greeting('Simon');
    greeting();

    function convertToFahrenheit(celsius) { // 7d - 7f
      fahrenheit = Math.round((celsius * 9/5) + 32) + 'F';
      return fahrenheit;
    }

    convertToFahrenheit(25);
    console.log(fahrenheit);

    function convertToCelsius(fahrenheit) {
      celsius = Math.round((fahrenheit - 32) * 5/9) + 'C';
      return celsius;
    }

    convertToCelsius(86);
    console.log(celsius);

    function convertTemperature(degrees, unit) {
      if (unit === 'C') {
        convertToFahrenheit(degrees);
        console.log(fahrenheit);
      } else if (unit === 'F') {
        convertToCelsius(degrees)
        console.log(celsius);
      }
    }

    convertTemperature(25, 'C');
    convertTemperature(1040, 'F');

    function convertLength(length, from, to) {
      if (from === 'miles' && to === 'km') {
        result = Math.round(length * 1.6) + ' km';
        console.log(result);
      } else if (from === 'km' && to === 'miles') {
        result = Math.round(length / 1.6) + ' miles';
        console.log(result);
      } else if (from === 'miles' && to === 'ft') {
        result = Math.round(length * 5280) + ' ft';
        console.log(result);
      } else if (from === 'ft' && to === 'miles') {
        result = Math.round(length / 5280) + ' miles';
        console.log(result);
      } else if (from === 'km' && to === 'ft') {
        result = Math.round(length * 3281) + ' ft';
        console.log(result);
      } else if (from === 'ft' && to === 'km') {
        result = Math.round(length / 3281) + ' km';
        console.log(result);
      } else {
        console.log('Please use miles, ft, or km. Conversion of same units unsupported.');
      }
    }

    convertLength(50, 'miles', 'km');
    convertLength(32, 'km', 'miles');
    convertLength(5, 'km', 'km');

    convertLength(5, 'miles', 'km');
    convertLength(5, 'miles', 'ft');
    convertLength(5, 'km', 'ft');
  </script>
