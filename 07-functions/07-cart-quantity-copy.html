<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Show Quantity</button>

    <button onclick="
      updateCartQuantity(1);
    ">Add to Cart</button>

    <button onclick="
      updateCartQuantity(2);
    ">+2</button>

    <button onclick="
      updateCartQuantity(3);
    ">+3</button>

    <button onclick="
      updateCartQuantity(-1);
    ">Remove from cart</button>

    <button onclick="
      updateCartQuantity(-2);
    ">-2</button>

    <button onclick="
      updateCartQuantity(-3);
    ">-3</button>

    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Reset Cart</button>

    <script>
      let cartQuantity = 0;

      function updateCartQuantity(button) {
        if (button === 1) {
          if (cartQuantity < 10) {
            cartQuantity++;
            console.log(`Cart quantity: ${cartQuantity}`);
          } else {
            alert('The cart is full.')
          }
        } else if (button === 2) {
          if (cartQuantity < 9) {
            cartQuantity += 2;
            console.log(`Cart quantity: ${cartQuantity}`);
          } else {
            alert('The cart is full.')
          }
        } else if (button === 3) {
          if (cartQuantity < 8) {
            cartQuantity += 3;
            console.log(`Cart quantity: ${cartQuantity}`);
          } else {
            alert('Cart is full.')
          }
        } else if (button === -1) {
          if (cartQuantity > 0) {
            cartQuantity--;
            console.log(`Cart quantity: ${cartQuantity}`);
          } else {
            alert('Not enough items in cart.');
          }
        } else if (button === -2) {
          if (cartQuantity > 1) {
            cartQuantity -= 2;
            console.log(`Cart quantity: ${cartQuantity}`);
          } else {
            alert('Not enough items in cart.');
          }
        } else if (button === -3) {
          if (cartQuantity > 2) {
            cartQuantity -= 3;
            console.log(`Cart quantity: ${cartQuantity}`);
          } else {
            alert('Not enough items in cart');
          }
        }
      }
    </script>
  </body>
</html>
