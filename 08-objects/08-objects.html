<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objects</title>
</head>
<body>
  <script>
    /*
    const product = { //objects let you store multiple values together.
      name: 'socks',
      price: 1090
    };
    console.log(product);
    console.log(product.name);
    console.log(product.price);

    product.name = 'cotton socks';
    console.log(product);

    product.newProperty = true;
    console.log(product);

    delete product.newProperty;
    console.log(product);
    */

    const product2 = {
      name: 'shirt',
      'delivery-time': '1 day',
      rating: { // nested object
        stars: 4.5,
        count: 87
      },
      fun: function function1() { // function nested inside object
        console.log('function inside object')
      }
    };
    console.log(product2);
    console.log(product2.name);
    console.log(product2['name']); // bracket notation lets us access values that normally wouldnt work with dot notation.
    console.log(product2['delivery-time']); // this variable for example does not work with dot notation because the dash makes JS think its math, so brackets and a string input circumvent that issue.

    console.log(product2.rating.count);
    product2.fun();

    console.log(typeof console.log); //methods are functions inside objects.

    //JSON means JavaScript Object Notation, similar syntax to objects, but has less features. JSON is more universal than JS, use JSON when sending data between computers. As well as storing data.

    console.log(JSON.stringify(product2)); // converts an object into JSON.
    const jsonString = JSON.stringify(product2);
    console.log(JSON.parse(jsonString));


  </script>
</body>
</html>
